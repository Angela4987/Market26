<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition>
<f:view>

<h:head>
    <title>Market</title>
</h:head>

<h:body>

<h:form enctype="multipart/form-data">

    <table>

        <tr>
            <td>Tituloa:</td>
            <td>
                <h:inputText
                    id="tituloa"
                    value="#{EskaintzaSortu.tituloa}" />
            </td>
        </tr>

        <tr>
            <td>Deskripzioa:</td>
            <td>
                <h:inputText
                    id="deskripzioa"
                    value="#{EskaintzaSortu.deskripzioa}" />
            </td>
        </tr>

        <tr>
            <td>Prezioa:</td>
            <td>
                <h:inputText
                    id="prezioa"
                    value="#{EskaintzaSortu.prezioa}" />
            </td>
        </tr>

        <tr>
        <td>Egoera:</td>
            <td><h:selectOneMenu id="zerrenda" value="#{EskaintzaSortu.egoera}" converter="EgoeraMotaConverter"> 
			<f:selectItems value="#{EskaintzaSortu.egoerak}"/> 

</h:selectOneMenu></td> 
        </tr>

        <tr>
            <td>Argitalpen eguna:</td>
            <td>
                <p:datePicker
                    id="data"
                    value="#{EskaintzaSortu.data}"
                    yearNavigator="true" />
            </td>
        </tr>

        <tr>
            <td>Argazkia:</td>
            <td>
                <h:inputFile
                    value="#{EskaintzaSortu.uploadedFile}" />
            </td>
        </tr>


        <tr>
            <td colspan="2">
                <h:commandButton
                    value="Sortu eskaintza"
                    action="#{EskaintzaSortu.gorde}" />
            </td>
            <td><h:button value="Atzera" outcome="ApplicationLauncher"/> </td>
        </tr>
        <tr><td><h:messages id="mezuak" style="color:blue"/></td></tr>
        

    </table>

</h:form>

</h:body>

</f:view>
</ui:composition>

</html>
